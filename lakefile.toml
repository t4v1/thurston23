# Lake package for the Thurston Question 23 formalization bundle.
# Requires a Mathlib worktree by path, pinned to 120ef86bf4 on Lean
# v4.29.0-rc2 (see README); nothing is downloaded or rebuilt.
name = "thurston23"
version = "0.1.0"
defaultTargets = ["CatalanLogSin", "Thurston23", "EisensteinLogSin", "Thurston23Eisenstein", "CatalanEisensteinRatio"]

[[require]]
name = "mathlib"
path = "../mathlib4-thurston"

[[lean_lib]]
name = "CatalanLogSin"

[[lean_lib]]
name = "Thurston23"

[[lean_lib]]
name = "EisensteinLogSin"

[[lean_lib]]
name = "Thurston23Eisenstein"

[[lean_lib]]
name = "CatalanEisensteinRatio"
